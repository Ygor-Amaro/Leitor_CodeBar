[project]
name = "leitor-cb"
version = "0.2.0"
description = "Leitor de códigos de barras FEBRABAN e QR Codes PIX em PDFs de pagamento"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "numpy>=2.5.1",
    "opencv-python>=5.0.0.93",
    "pymupdf>=1.28.0",
    "zxing-cpp>=3.1.1",
]

[project.scripts]
leitor-cb = "leitor_cb.adapters.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.16.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leitor_cb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplificações
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
